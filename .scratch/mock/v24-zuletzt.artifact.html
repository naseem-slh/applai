    <title>Applai · Zuletzt benutzt, vier Fassungen</title>
    <style>
      /* =====================================================================
         Attrappe: „Zuletzt benutzt" auf der Vorbereiten-Seite.

         Die Frage ist klein und die Antwort trotzdem nicht offensichtlich:
         **Wo steht ein Angebot, das keine Aufgabe ist?**

         Ein Zwischenstand aus einer früheren Sitzung ist nichts, was der
         Nutzer sich vorgenommen hat. Er ist eine Abkürzung, die die Seite
         anbietet. Die heutige Fassung stellt ihn als eigene Karte **über**
         die Kacheln und schiebt damit die Arbeit nach unten — sie behandelt
         das Angebot wie den Auftrag.

         Vier Fassungen zum Durchklicken. Token, Schriften und Blattlage sind
         wörtlich aus `src/styles/design.css` übernommen, damit die Attrappe
         nicht neben der Anwendung steht.

         ---------------------------------------------------------------------
         HEUTE  Die Karte über den Kacheln. Überschrift, zwei Zeilen mit
                Datum, vier Knöpfe. Rund 130px hoch, bevor die eigentliche
                Seite anfängt.

         A      **Auf der Kachel.** Das Angebot gehört zu der Fläche, die es
                füllt. In der leeren Kachel liegt eine Marke mit dem
                Dateinamen; ein Druck füllt sie, das Kreuz daneben verwirft
                den Zwischenstand. Null zusätzliche Höhe, kein Satz.

                Die Marke liegt **über** der Kachel, nicht in ihr: Die Kachel
                ist selbst ein Knopf, und ein Knopf im Knopf ist kein
                gültiges Auszeichnungsformat.

         B      **Eine Zeile.** Unter den Kacheln, eine Zeile hoch: die
                Namen als Knöpfe, am Ende ein Verwerfen. Der sichere Weg —
                sofort verständlich, aber ohne Bezug zur Kachel.

         C      **Der Notizzettel.** Ein gekippter Zettel auf dem Blatt neben
                der Karte, in der Sprache der Kritzeleien. Er liegt außerhalb
                der Karte und schiebt deshalb nichts. Braucht Platz zur
                Seite und fällt unter 1140px weg. Darunter bräuchte er einen
                Rückfall — und der wäre A.
         ===================================================================== */

    <script>
      /* Eine Wahl je Gruppe. Die Fassung hängt am `data-variant` des Körpers,
         damit sich jede Darstellung im Stylesheet ablesen lässt. */
      document.querySelectorAll('.seg').forEach((gruppe) => {
        gruppe.addEventListener('click', (ereignis) => {
          const knopf = ereignis.target.closest('button')
          if (knopf === null) return
          gruppe.querySelectorAll('button').forEach((anderer) =>
            anderer.setAttribute('aria-checked', String(anderer === knopf)),
          )
          if (gruppe.dataset.group === 'variant') {
            document.body.dataset.variant = knopf.dataset.value
          }
          if (gruppe.dataset.group === 'theme') {
            const wert = knopf.dataset.value
            if (wert === 'system') document.documentElement.removeAttribute('data-theme')
            else document.documentElement.setAttribute('data-theme', wert)
          }
        })
      })

      /* Die Marke füllt ihre Kachel — damit sich der Weg wirklich durchspielen
         lässt und nicht nur behauptet wird. */
      document.querySelectorAll('.recall-chip__use, .recall-note .btn').forEach((knopf) => {
        knopf.addEventListener('click', () => {
          const halter = knopf.closest('.tile-wrap')
          const name = knopf.textContent.trim()
          const ziel = halter ?? document.querySelectorAll('.tile-wrap')[
            knopf.closest('.recall-note--cv') === null ? 0 : 1
          ]
          ziel.classList.add('is-loaded')
          ziel.querySelector('.tile').classList.add('is-loaded')
          ziel.querySelector('.tile__file').textContent =
            name.includes('lebenslauf') || knopf.closest('.recall-note--cv') !== null
              ? 'lebenslauf.docx'
              : 'anschreiben.docx'
          const zettel = knopf.closest('.recall-note')
          if (zettel !== null) zettel.style.display = 'none'
        })
      })
    </script>
